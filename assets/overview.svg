<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">THE IMPROVEMENT CYCLE</title><desc id="desc">Use feedback to propose the next revision. Compare the change target, feedback source, and acceptance rule.</desc>
<rect width="1100" height="300" rx="16" fill="#132d35"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#91c9c0"/></marker></defs>
<g font-family="Verdana, sans-serif"><text x="38" y="38" fill="#9bb8bf" font-size="12" letter-spacing="3">THE IMPROVEMENT CYCLE</text><rect x="80" y="92" width="260" height="104" rx="8" fill="#1e3b44" stroke="#47646b"/><text x="102" y="128" fill="#f6f5ed" font-size="24">Propose</text><text x="102" y="159" fill="#c7d8da" font-size="14">Change an artifact</text><path d="M348 144H407" stroke="#91c9c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="92" width="260" height="104" rx="8" fill="#28544f" stroke="#91c9c0"/><text x="442" y="128" fill="#f6f5ed" font-size="24">Evaluate</text><text x="442" y="159" fill="#c7d8da" font-size="14">Check the candidate</text><path d="M688 144H747" stroke="#91c9c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="92" width="260" height="104" rx="8" fill="#1e3b44" stroke="#47646b"/><text x="782" y="128" fill="#f6f5ed" font-size="24">Retain</text><text x="782" y="159" fill="#c7d8da" font-size="14">Keep a useful revision</text><path d="M890 201V230H210V203" fill="none" stroke="#91c9c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="354" y="217" width="392" height="26" fill="#132d35"/><text x="550" y="235" text-anchor="middle" fill="#c7d8da" font-size="13">Use feedback to propose the next revision</text><text x="550" y="276" text-anchor="middle" fill="#9bb8bf" font-size="14">Compare the change target, feedback source, and acceptance rule.</text></g></svg>
