<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="t"><title id="t">THE IMPROVEMENT CYCLE</title><rect width="480" height="430" rx="12" fill="#132d35"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#91c9c0"/></marker></defs><g font-family="Verdana,sans-serif"><text x="32" y="34" fill="#9bb8bf" font-size="13" letter-spacing="2">THE IMPROVEMENT CYCLE</text><rect x="40" y="59" width="350" height="84" rx="7" fill="#1e3b44" stroke="#5d8588"/><text x="62" y="92" fill="#f6f5ed" font-size="24">Propose</text><text x="62" y="118" fill="#c7d8da" font-size="15">Change an artifact</text><path d="M215 149V164" fill="none" stroke="#91c9c0" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="171" width="350" height="84" rx="7" fill="#28544f" stroke="#5d8588"/><text x="62" y="204" fill="#f6f5ed" font-size="24">Evaluate</text><text x="62" y="230" fill="#c7d8da" font-size="15">Check the candidate</text><path d="M215 261V276" fill="none" stroke="#91c9c0" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="283" width="350" height="84" rx="7" fill="#1e3b44" stroke="#5d8588"/><text x="62" y="316" fill="#f6f5ed" font-size="24">Retain</text><text x="62" y="342" fill="#c7d8da" font-size="15">Keep a useful revision</text><path d="M395 325H435V100H397" stroke="#91c9c0" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="400" font-size="15" fill="#c7d8da">Use feedback for the next revision.</text></g></svg>
